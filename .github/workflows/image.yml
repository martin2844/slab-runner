name: Publish image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CODEX_VERSION: "0.148.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build native smoke image
        run: docker build --build-arg CODEX_VERSION="$CODEX_VERSION" --tag slab-runner:smoke .
      - name: Verify image user and Codex version
        run: |
          test "$(docker run --rm --entrypoint id slab-runner:smoke -u)" = "10001"
          docker run --rm --entrypoint codex slab-runner:smoke --version | grep -F "codex-cli $CODEX_VERSION"
      - name: Verify authenticated container listener
        run: |
          docker run --rm --detach \
            --name slab-runner-smoke \
            --publish 127.0.0.1:16990:6990 \
            --env RUNNER_HOST=0.0.0.0 \
            --env RUNNER_TOKEN=test-only-runner-token \
            slab-runner:smoke
          trap 'docker stop slab-runner-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:16990/health && break
            test "$attempt" -lt 30
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:16990/runtimes)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Authorization: Bearer test-only-runner-token' http://127.0.0.1:16990/runtimes)" = "200"

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CODEX_VERSION=${{ env.CODEX_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_NAME@$DIGEST"
      - name: Scan immutable image digest
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" | tee image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: slab-runner-image-digest
          path: image-digest.txt
          if-no-files-found: error

